name: Deploy

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -F server exec wrangler whoami
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: pnpm build
      - name: Reject outdated main commit before migration
        shell: bash
        run: |
          latest_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ "$latest_sha" != "$GITHUB_SHA" ]]; then
            echo "::error::Refusing to migrate outdated main commit $GITHUB_SHA (current: $latest_sha)"
            exit 1
          fi
      - run: pnpm -F server run db:migrate:remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Reject outdated main commit before deployment
        shell: bash
        run: |
          latest_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ "$latest_sha" != "$GITHUB_SHA" ]]; then
            echo "::error::Refusing to deploy outdated main commit $GITHUB_SHA (current: $latest_sha)"
            exit 1
          fi
      - run: pnpm -F server run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
